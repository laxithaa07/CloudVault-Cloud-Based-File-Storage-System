{% extends "base.html" %}
{% block title %}Create account - CloudVault{% endblock %}
{% block content %}
<section class="form-card"><h1>Create your account</h1>
<form method="post">
  <label>Username</label><input name="username" minlength="3" maxlength="40" required autocomplete="username">
  <label>Password</label><input name="password" type="password" minlength="8" required autocomplete="new-password">
  <button class="button full">Create account</button>
</form><p class="hint">Use at least 8 characters for your password.</p>
<p>Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></section>
{% endblock %}
