{% extends "base.html" %}
{% block title %}Sign in - CloudVault{% endblock %}
{% block content %}
<section class="form-card"><h1>Welcome back</h1>
<form method="post">
  <label>Username</label><input name="username" required autocomplete="username">
  <label>Password</label><input name="password" type="password" required autocomplete="current-password">
  <button class="button full">Sign in</button>
</form><p>New here? <a href="{{ url_for('register') }}">Create an account</a></p></section>
{% endblock %}
